<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1A1A18">
<title>宝宝记录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#1A1A18;--card:#2A2A28;--card2:#333330;--text:#E5E3DC;--sub:#9E9C95;--border:#3a3a38;--purple:#534AB7;--purple-l:#CECBF6;--blue:#185FA5;--blue-l:#B5D4F4;--pink:#993556;--pink-l:#F4C0D1;--teal:#0F6E56;--teal-l:#9FE1CB;--amber:#854F0B;--amber-l:#FAC775;--red:#A32D2D;--red-l:#F7C1C1;--chip-active:#534AB7}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:60px;position:relative}
.page{display:none;padding:16px}.page.active{display:block}
h2{font-size:17px;font-weight:600;margin-bottom:14px}
.profile-bar{display:flex;align-items:center;gap:12px;padding:8px 0 16px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;color:var(--purple-l);font-weight:600;font-size:18px;flex-shrink:0}
.profile-bar .info .name{font-size:16px;font-weight:600}
.profile-bar .info .meta{font-size:12px;color:var(--sub)}
.tag{margin-left:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px 10px;font-size:11px;color:var(--teal-l)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat-card{background:var(--card);border-radius:12px;padding:14px}
.stat-card .label{font-size:11px;color:var(--sub)}
.stat-card .value{font-size:24px;font-weight:600;margin-top:3px}
.stat-card .value .unit{font-size:12px;color:var(--sub);font-weight:400;margin-left:2px}
.stat-card .sub-val{font-size:11px;color:var(--sub);margin-top:4px}
.stat-card .sub-val.warn{color:var(--red-l)}
.section-title{font-size:13px;color:var(--sub);margin-bottom:10px}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.quick-btn{border:none;border-radius:12px;padding:13px 0;text-align:center;font-size:13px;font-weight:600;color:#fff;cursor:pointer}
.quick-btn .qb-sub{display:block;font-size:10px;font-weight:400;opacity:.85;margin-top:2px}
.more-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.more-type-btn{border-radius:10px;padding:14px 0;font-size:13px;font-weight:600;background:var(--card2);border:1px solid var(--border);cursor:pointer}
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border)}
.tl-item:last-child{border-bottom:none}
.tl-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.tl-time{font-size:11px;color:var(--sub);width:42px;flex-shrink:0;margin-top:1px}
.tl-text{font-size:13px;flex:1}
.tl-text .warn{color:var(--red-l);font-weight:500}
.rec-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
.rec-tabs::-webkit-scrollbar{display:none}
.rec-tab{flex-shrink:0;text-align:center;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:500;background:var(--card);border:1px solid var(--border);color:var(--sub);cursor:pointer;white-space:nowrap}
.rec-tab.active{color:#fff;border:none}
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-item{background:var(--card);border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px}
.rec-item .ri-time{font-size:12px;color:var(--sub);width:52px;flex-shrink:0}
.rec-item .ri-main{flex:1;font-size:13px}
.rec-item .ri-main .ri-sub{font-size:11px;color:var(--sub);margin-top:2px}
.rec-item .ri-main .warn{color:var(--red-l)}
.rec-item .ri-del{color:var(--sub);font-size:18px;cursor:pointer;padding:4px 8px;border:none;background:none}
.rec-empty{text-align:center;color:var(--sub);padding:48px 0;font-size:13px}
.sheet-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100}
.sheet-mask.show{display:block}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:var(--card);border-radius:20px 20px 0 0;padding:20px 18px 32px;z-index:101;transition:transform .28s ease;max-height:85vh;overflow-y:auto}
.sheet.show{transform:translateX(-50%) translateY(0)}
.sheet-title{font-size:16px;font-weight:600;margin-bottom:18px;text-align:center}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.field input:focus,.field select:focus{border-color:var(--purple-l)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:10px;background:var(--card2);border:1px solid var(--border);font-size:13px;cursor:pointer;color:var(--sub)}
.chip.active{background:var(--chip-active);color:#fff;border-color:var(--chip-active)}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:13px 0;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--purple);color:#fff}
.btn-cancel{background:var(--card2);color:var(--sub);border:1px solid var(--border)}
.mine-card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px}
.mine-card .mc-title{font-size:14px;font-weight:600;margin-bottom:14px}
.io-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:var(--card2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;cursor:pointer;margin-bottom:10px}
.io-btn .io-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.io-btn .io-icon.exp{background:var(--teal);color:#fff}
.io-btn .io-icon.imp{background:var(--blue);color:#fff}
.io-btn .io-text{text-align:left;flex:1}
.io-btn .io-text .io-sub{font-size:11px;color:var(--sub);margin-top:1px}
.danger-btn{width:100%;padding:13px;background:transparent;border:1px solid var(--red);border-radius:12px;color:var(--red-l);font-size:13px;cursor:pointer;margin-top:8px}
.stat-mini-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat-mini{background:var(--card2);border-radius:10px;padding:10px 8px;text-align:center}
.stat-mini .sm-label{font-size:10px;color:var(--sub)}
.stat-mini .sm-val{font-size:16px;font-weight:600;margin-top:2px}
.theme-grid{display:flex;gap:14px;flex-wrap:wrap}
.theme-item{text-align:center;cursor:pointer}
.theme-swatch{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;position:relative}
.theme-dot{width:22px;height:22px;border-radius:50%}
.theme-item.active .theme-swatch{outline:2px solid var(--purple);outline-offset:3px}
.theme-item.active .theme-swatch::after{content:'✓';position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--purple);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.theme-name{font-size:11px;color:var(--sub)}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--border);z-index:50}
.tabbar .tab{flex:1;text-align:center;padding:9px 0 11px;font-size:10px;color:var(--sub);cursor:pointer;border:none;background:none;font-family:inherit}
.tabbar .tab.active{color:var(--purple-l);font-weight:600}
.tabbar .tab .ti{font-size:18px;display:block;margin-bottom:2px;line-height:1}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 22px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.confirm-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300}
.confirm-mask.show{display:block}
.confirm-box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);width:290px;max-width:90vw;background:var(--card2);border:1px solid var(--border);border-radius:18px;padding:28px 22px 18px;z-index:301;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.confirm-box.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.confirm-msg{font-size:15px;line-height:1.6;color:var(--text);margin-bottom:22px;text-align:center;white-space:pre-line}
.confirm-btns{display:flex;gap:10px}
.confirm-btns .btn{flex:1}
.tl-del{flex-shrink:0;width:26px;height:26px;border:none;background:transparent;color:var(--sub);font-size:16px;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center}
.tl-del:active{background:var(--card2)}
.sub-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{flex-shrink:0;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:500;background:var(--card);border:1px solid var(--border);color:var(--sub);cursor:pointer;white-space:nowrap}
.sub-tab.active{color:#fff;border:none}
.chart-box{background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px}
.chart-box .cb-empty{text-align:center;color:var(--sub);padding:30px 0;font-size:13px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.photo-card{background:var(--card);border-radius:12px;overflow:hidden}
.photo-card img{width:100%;height:140px;object-fit:cover;display:block;background:var(--card2)}
.photo-card video{width:100%;height:140px;object-fit:cover;display:block;background:var(--card2)}
.photo-card .pc-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:9px;padding:2px 6px;border-radius:6px}
.photo-card{position:relative}
.video-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;align-items:center;justify-content:center}
.video-modal.show{display:flex}
.video-modal video{max-width:95vw;max-height:85vh;border-radius:8px}
.video-modal .vm-close{position:absolute;top:16px;right:16px;color:#fff;font-size:28px;cursor:pointer;background:rgba(255,255,255,.15);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.image-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;align-items:center;justify-content:center;flex-direction:column}
.image-modal.show{display:flex}
.image-modal img{max-width:95vw;max-height:85vh;border-radius:8px;object-fit:contain}
.image-modal .im-info{color:#fff;font-size:13px;margin-top:12px;text-align:center;padding:0 20px}
.photo-card .pc-info{padding:10px 12px}
.photo-card .pc-info .pc-date{font-size:11px;color:var(--sub)}
.photo-card .pc-info .pc-text{font-size:13px;margin-top:2px;word-break:break-word}
.event-item{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.event-item .ev-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.event-item .ev-main{flex:1}
.event-item .ev-main .ev-date{font-size:11px;color:var(--sub);margin-bottom:3px}
.event-item .ev-main .ev-text{font-size:13px}
.event-item .ev-del{color:var(--sub);font-size:18px;cursor:pointer;padding:4px;border:none;background:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px}
.cal-head{text-align:center;font-size:10px;color:var(--sub);padding:4px 0}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer;position:relative;background:var(--card)}
.cal-cell.other{opacity:.3}
.cal-cell.today{border:1px solid var(--purple-l)}
.cal-cell.has-rec .cal-dots{display:flex;gap:2px;margin-top:2px}
.cal-cell .cal-dots span{width:4px;height:4px;border-radius:50%}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-nav .cal-month{font-size:15px;font-weight:600}
.cal-nav button{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-size:13px;cursor:pointer}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:120px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:14px}
.bar-chart .bar{flex:1;background:var(--purple);border-radius:4px 4px 0 0;min-height:2px;position:relative;display:flex;justify-content:center}
.bar-chart .bar .bar-val{position:absolute;top:-16px;font-size:9px;color:var(--sub);white-space:nowrap}
.bar-chart .bar .bar-lbl{position:absolute;bottom:-16px;font-size:8px;color:var(--sub)}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card);border-radius:10px;margin-bottom:8px}
.stat-row .sr-label{font-size:13px;color:var(--sub)}
.stat-row .sr-val{font-size:16px;font-weight:600}
.custom-type-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card2);border-radius:10px;margin-bottom:8px}
.custom-type-item .cti-color{width:20px;height:20px;border-radius:6px;flex-shrink:0}
.custom-type-item .cti-name{flex:1;font-size:13px}
.custom-type-item .cti-del{color:var(--sub);font-size:16px;cursor:pointer;border:none;background:none}
.photo-preview{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:8px;background:var(--card2)}
</style>
</head>
<body>
<div id="app">
  <div id="page-home" class="page"></div>
  <div id="page-records" class="page"></div>
  <div id="page-growth" class="page"></div>
  <div id="page-review" class="page"></div>
  <div id="page-mine" class="page"></div>
  <nav class="tabbar">
    <button class="tab" data-page="home" onclick="go('home')"><span class="ti">⌂</span>首页</button>
    <button class="tab" data-page="records" onclick="go('records')"><span class="ti">▤</span>记录</button>
    <button class="tab" data-page="growth" onclick="go('growth')"><span class="ti">↗</span>成长</button>
    <button class="tab" data-page="review" onclick="go('review')"><span class="ti">▦</span>回顾</button>
    <button class="tab" data-page="mine" onclick="go('mine')"><span class="ti">☺</span>我的</button>
  </nav>
</div>
<div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="confirm-mask" id="confirmMask" onclick="closeConfirm()"></div>
<div class="confirm-box" id="confirmBox"></div>
<div class="video-modal" id="videoModal" onclick="if(event.target===this)closeVideoModal()"><span class="vm-close" onclick="closeVideoModal()">&times;</span><video id="videoPlayer" controls></video></div>
<div class="image-modal" id="imageModal" onclick="if(event.target===this)closeImageModal()"><span class="vm-close" onclick="closeImageModal()">&times;</span><img id="imageViewer" alt=""><div class="im-info" id="imageInfo"></div></div>
<input type="file" id="importInput" accept=".json" style="display:none">
<input type="file" id="photoInput" accept="image/*,video/*" style="display:none">
<input type="file" id="eventPhotoInput" accept="image/*" style="display:none">

<script>
/* ========== 主题配色 ========== */
var THEMES={
  dark:{name:'深色',bg:'#1A1A18',card:'#2A2A28',card2:'#333330',text:'#E5E3DC',sub:'#9E9C95',border:'#3a3a38',purpleL:'#CECBF6',blueL:'#B5D4F4',pinkL:'#F4C0D1',tealL:'#9FE1CB',amberL:'#FAC775',redL:'#F7C1C1'},
  light:{name:'浅色',bg:'#FFFFFF',card:'#F5F5F3',card2:'#EBEBE9',text:'#1A1A18',sub:'#6E6C65',border:'#E0E0DE',purpleL:'#534AB7',blueL:'#185FA5',pinkL:'#993556',tealL:'#0F6E56',amberL:'#854F0B',redL:'#A32D2D'},
  green:{name:'护眼绿',bg:'#C7EDCC',card:'#DCF0E0',card2:'#C5E5CB',text:'#1A3A20',sub:'#4A6B50',border:'#A8D5AE',purpleL:'#534AB7',blueL:'#185FA5',pinkL:'#993556',tealL:'#0F6E56',amberL:'#854F0B',redL:'#A32D2D'},
  warm:{name:'暖米色',bg:'#F5EBD8',card:'#FBF5E8',card2:'#F0E5CC',text:'#3A2E1A',sub:'#7A6B4E',border:'#E5D8BE',purpleL:'#534AB7',blueL:'#185FA5',pinkL:'#993556',tealL:'#0F6E56',amberL:'#854F0B',redL:'#A32D2D'},
  pink:{name:'淡粉',bg:'#FDEEF0',card:'#FFF5F7',card2:'#F5E0E5',text:'#3A1A20',sub:'#7A4A50',border:'#E5C5CE',purpleL:'#534AB7',blueL:'#185FA5',pinkL:'#993556',tealL:'#0F6E56',amberL:'#854F0B',redL:'#A32D2D'}
};
function applyTheme(){
  var key=localStorage.getItem('baby_tracker_theme')||'dark';
  var t=THEMES[key]||THEMES.dark;
  var r=document.documentElement.style;
  r.setProperty('--bg',t.bg);r.setProperty('--card',t.card);r.setProperty('--card2',t.card2);
  r.setProperty('--text',t.text);r.setProperty('--sub',t.sub);r.setProperty('--border',t.border);
  r.setProperty('--purple-l',t.purpleL);r.setProperty('--blue-l',t.blueL);r.setProperty('--pink-l',t.pinkL);
  r.setProperty('--teal-l',t.tealL);r.setProperty('--amber-l',t.amberL);r.setProperty('--red-l',t.redL);
  var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',t.bg);
}
function setTheme(key){localStorage.setItem('baby_tracker_theme',key);applyTheme();renderMine();toast('已切换至'+(THEMES[key]?THEMES[key].name:'')+'主题')}
applyTheme();

/* ========== 内置记录类型配置 ========== */
var BUILTIN_REC={
  feed:{name:'喂奶',color:'#534AB7',light:'#AFA9EC',quick:true,sortField:'time',
    fields:[{key:'type',label:'类型',type:'chips',opts:[['formula','配方奶'],['breast','母乳']],def:'formula'},{key:'amount',label:'奶量(ml)',type:'number',ph:'如120',show:{field:'type',val:'formula'}},{key:'duration',label:'哺乳时长(分钟)',type:'number',ph:'如15',show:{field:'type',val:'breast'}},{key:'side',label:'侧别',type:'chips',opts:[['左','左'],['右','右'],['双侧','双侧']],def:'双侧',show:{field:'type',val:'breast'}},{key:'note',label:'备注',type:'text',ph:'可选'}],
    summary:function(r){if(r.type==='breast')return'母乳 '+(r.side||'')+' '+(r.duration||0)+'分钟';return'配方奶 '+(r.amount||0)+'ml';}},
  burp:{name:'拍嗝',color:'#854F0B',light:'#FAC775',quick:true,sortField:'time',
    fields:[{key:'result',label:'是否拍出',type:'chips',opts:[['yes','已拍出'],['no','未拍出']],def:'yes'},{key:'duration',label:'时长(分钟)',type:'number',ph:'如5'},{key:'note',label:'备注',type:'text',ph:'可选'}],
    summary:function(r){return'拍嗝·'+(r.result==='yes'?'已拍出':'未拍出')+(r.duration?(' '+r.duration+'分钟'):'');}},
  sleep:{name:'睡眠',color:'#185FA5',light:'#85B7EB',quick:true,sortField:'endTime',
    fields:[{key:'startTime',label:'入睡时间',type:'datetime'},{key:'endTime',label:'醒来时间',type:'datetime'},{key:'_dur',label:'时长',type:'calc',calc:function(v){if(v.startTime&&v.endTime)return sleepDuration(v.startTime,v.endTime);return'';}},{key:'note',label:'备注',type:'text',ph:'可选'}],
    summary:function(r){return'睡眠·'+sleepDuration(r.startTime,r.endTime);}},
  diaper:{name:'尿布',color:'#993556',light:'#ED93B1',quick:true,sortField:'time',
    fields:[{key:'type',label:'类型',type:'chips',opts:[['wet','尿'],['dirty','便'],['both','尿+便']],def:'wet'},{key:'note',label:'备注(颜色/状态)',type:'text',ph:'如金黄色'}],
    summary:function(r){var m={wet:'尿',dirty:'便',both:'尿+便'};return'换尿布·'+(m[r.type]||r.type||'')+(r.note?(' '+r.note):'');}},

/* ========== 数据层 localStorage ========== */
var KEYS={profile:'baby_tracker_profile',custom:'baby_tracker_custom_types',photos:'baby_tracker_photos',events:'baby_tracker_events'};
BUILTIN_ORDER.forEach(function(t){KEYS[t]='baby_tracker_'+t;});
var DB={
  getProfile:function(){try{return JSON.parse(localStorage.getItem(KEYS.profile))||{}}catch(e){return{}}},
  setProfile:function(p){localStorage.setItem(KEYS.profile,JSON.stringify(p))},
  getList:function(type){try{return JSON.parse(localStorage.getItem(KEYS[type]))||[]}catch(e){return[]}},
  add:function(type,r){var d=this.getList(type);d.push(r);localStorage.setItem(KEYS[type],JSON.stringify(d))},
  del:function(type,id){var d=this.getList(type).filter(function(x){return x.id!==id});localStorage.setItem(KEYS[type],JSON.stringify(d))},
  getCustomTypes:function(){try{return JSON.parse(localStorage.getItem(KEYS.custom))||[]}catch(e){return[]}},
  addCustomType:function(c){var d=this.getCustomTypes();d.push(c);localStorage.setItem(KEYS.custom,JSON.stringify(d))},
  delCustomType:function(id){var d=this.getCustomTypes().filter(function(x){return x.id!==id});localStorage.setItem(KEYS.custom,JSON.stringify(d))},
  getPhotos:function(){try{return JSON.parse(localStorage.getItem(KEYS.photos))||[]}catch(e){return[]}},
  addPhoto:function(p){var d=this.getPhotos();d.push(p);localStorage.setItem(KEYS.photos,JSON.stringify(d))},
  delPhoto:function(id){var d=this.getPhotos().filter(function(x){return x.id!==id});localStorage.setItem(KEYS.photos,JSON.stringify(d))},
  getEvents:function(){try{return JSON.parse(localStorage.getItem(KEYS.events))||[]}catch(e){return[]}},
  addEvent:function(e){var d=this.getEvents();d.push(e);localStorage.setItem(KEYS.events,JSON.stringify(d))},
  delEvent:function(id){var d=this.getEvents().filter(function(x){return x.id!==id});localStorage.setItem(KEYS.events,JSON.stringify(d))},
  getAllKeys:function(){var o={};o[KEYS.profile]=localStorage.getItem(KEYS.profile);o[KEYS.custom]=localStorage.getItem(KEYS.custom);o[KEYS.photos]=localStorage.getItem(KEYS.photos);o[KEYS.events]=localStorage.getItem(KEYS.events);BUILTIN_ORDER.forEach(function(t){o[KEYS[t]]=localStorage.getItem(KEYS[t])});DB.getCustomTypes().forEach(function(c){var ck='baby_tracker_custom_'+c.id;o[ck]=localStorage.getItem(ck)});return o},
  replaceAll:function(data){var allK=[KEYS.profile,KEYS.custom,KEYS.photos,KEYS.events].concat(BUILTIN_ORDER.map(function(t){return KEYS[t]}));allK.forEach(function(k){if(data[k]!==undefined&&data[k]!==null)localStorage.setItem(k,data[k])})},
  mergeData:function(data){
    var stats={merged:0,added:0};
    // 1. 合并自定义类型定义（按id去重，新的追加）
    if(data[KEYS.custom]&&data[KEYS.custom]!=='null'){
      var impCustom;try{impCustom=JSON.parse(data[KEYS.custom])}catch(e){impCustom=[]}
      if(Array.isArray(impCustom)&&impCustom.length>0){
        var existCustom=DB.getCustomTypes();
        impCustom.forEach(function(c){if(!existCustom.find(function(x){return x.id===c.id}))existCustom.push(c)});
        localStorage.setItem(KEYS.custom,JSON.stringify(existCustom));
      }
    }
    // 2. 重新加载类型配置
    loadRecTypes();
    // 3. 合并所有记录类型（内置+自定义），按时间点去重
    REC_ORDER.forEach(function(type){
      var key=type.indexOf('custom_')===0?'baby_tracker_'+type:KEYS[type];
      if(!data[key]||data[key]==='null'||data[key]===null)return;
      var imp;try{imp=JSON.parse(data[key])}catch(e){return}
      if(!Array.isArray(imp)||imp.length===0)return;
      var exist=type.indexOf('custom_')===0?DB.getCustomList(type):DB.getList(type);
      var cfg=REC[type];if(!cfg)return;
      var merged=exist.slice();
      imp.forEach(function(r){
        var rTime=recTime(r,cfg);
        var idx=-1;
        for(var i=0;i<merged.length;i++){if(recTime(merged[i],cfg)===rTime){idx=i;break}}
        if(idx>=0){merged[idx]=r;stats.merged++}else{merged.push(r);stats.added++}
      });
      merged.sort(function(a,b){var ta=recTime(a,cfg),tb=recTime(b,cfg);return ta<tb?-1:(ta>tb?1:0)});
      localStorage.setItem(key,JSON.stringify(merged));
    });
    // 4. 合并照片（按id去重）
    if(data[KEYS.photos]&&data[KEYS.photos]!=='null'){
      var impP;try{impP=JSON.parse(data[KEYS.photos])}catch(e){impP=[]}
      if(Array.isArray(impP)&&impP.length>0){
        var existP=DB.getPhotos();
        impP.forEach(function(p){var idx=existP.findIndex(function(x){return x.id===p.id});if(idx>=0){existP[idx]=p;stats.merged++}else{existP.push(p);stats.added++}});
        localStorage.setItem(KEYS.photos,JSON.stringify(existP));
      }
    }
    // 5. 合并事件（按id去重）
    if(data[KEYS.events]&&data[KEYS.events]!=='null'){
      var impE;try{impE=JSON.parse(data[KEYS.events])}catch(e){impE=[]}
      if(Array.isArray(impE)&&impE.length>0){
        var existE=DB.getEvents();
        impE.forEach(function(ev){var idx=existE.findIndex(function(x){return x.id===ev.id});if(idx>=0){existE[idx]=ev;stats.merged++}else{existE.push(ev);stats.added++}});
        localStorage.setItem(KEYS.events,JSON.stringify(existE));
      }
    }
    // 6. 档案：有数据就覆盖
    if(data[KEYS.profile]&&data[KEYS.profile]!=='null')localStorage.setItem(KEYS.profile,data[KEYS.profile]);
    return stats;
  },
  clearAll:function(){BUILTIN_ORDER.forEach(function(t){localStorage.removeItem(KEYS[t])});localStorage.removeItem(KEYS.photos);localStorage.removeItem(KEYS.events);DB.getCustomTypes().forEach(function(c){localStorage.removeItem('baby_tracker_custom_'+c.id)})},
  getCustomList:function(key){try{return JSON.parse(localStorage.getItem('baby_tracker_'+key))||[]}catch(e){return[]}},
  addCustom:function(key,r){var d=this.getCustomList(key);d.push(r);localStorage.setItem('baby_tracker_'+key,JSON.stringify(d))},
  delCustom:function(key,id){var d=this.getCustomList(key).filter(function(x){return x.id!==id});localStorage.setItem('baby_tracker_'+key,JSON.stringify(d))}
};
KEYS.getCustom=function(key){return'baby_tracker_'+key};

/* ========== IndexedDB 媒体存储 ========== */
var IDB={db:null,ready:false,
  open:function(){return new Promise(function(res){
    if(IDB.ready&&IDB.db){res();return}
    try{
      if(!window.indexedDB){res();return}
      var r=indexedDB.open('baby_tracker_media',1);
      r.onupgradeneeded=function(e){e.target.result.createObjectStore('media')};
      r.onsuccess=function(e){IDB.db=e.target.result;IDB.ready=true;res()};
      r.onerror=function(){res()};
    }catch(e){console.warn('IndexedDB open failed:',e);res()}
  })},
  put:function(key,blob){return new Promise(function(res){try{if(!IDB.db){res(false);return}var tx=IDB.db.transaction('media','readwrite');tx.objectStore('media').put(blob,key);tx.oncomplete=function(){res(true)};tx.onerror=function(){res(false)};tx.onabort=function(){res(false)}}catch(e){console.warn('IDB.put error:',e);res(false)}})},
  get:function(key){return new Promise(function(res){try{if(!IDB.db){res(null);return}var tx=IDB.db.transaction('media','readonly');var r=tx.objectStore('media').get(key);r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){console.warn('IDB.get error:',e);res(null)}})},
  del:function(key){return new Promise(function(res){try{if(!IDB.db){res();return}var tx=IDB.db.transaction('media','readwrite');tx.objectStore('media').delete(key);tx.oncomplete=function(){res()};tx.onerror=function(){res()}}catch(e){console.warn('IDB.del error:',e);res()}})},
  clear:function(){return new Promise(function(res){try{if(!IDB.db){res();return}var tx=IDB.db.transaction('media','readwrite');tx.objectStore('media').clear();tx.oncomplete=function(){res()};tx.onerror=function(){res()}}catch(e){console.warn('IDB.clear error:',e);res()}})},
  getAllKeys:function(){return new Promise(function(res){try{if(!IDB.db){res([]);return}var tx=IDB.db.transaction('media','readonly');var r=tx.objectStore('media').getAllKeys();r.onsuccess=function(){res(r.result||[])};r.onerror=function(){res([])}}catch(e){console.warn('IDB.getAllKeys error:',e);res([])}})},
  getAll:function(){return new Promise(function(res){try{if(!IDB.db){res({});return}var tx=IDB.db.transaction('media','readonly');var r=tx.objectStore('media').getAll();r.onsuccess=function(){var m={};(r.result||[]).forEach(function(v,i){m['idx_'+i]=v});res(m)};r.onerror=function(){res({})}}catch(e){console.warn('IDB.getAll error:',e);res({})}})}
};

/* ========== 工具函数 ========== */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n){return n<10?'0'+n:''+n}
function nowLocal(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtHM(iso){if(!iso)return'';var p=iso.split('T')[1];return p?p:iso}
function fmtDate(iso){if(!iso)return'';return iso.split('T')[0]}
function sameDay(a,b){return a&&b&&a.split('T')[0]===b.split('T')[0]}
function calcAge(birth){if(!birth)return'';var b=new Date(birth),n=new Date();var days=Math.floor((n-b)/86400000);if(days<0)return'未出生';if(days<30)return days+'天';var m=Math.floor(days/30),d=days%30;return m+'个月'+(d>0?d+'天':'')}
function minsSince(iso){var t=new Date(iso),n=new Date();return Math.floor((n-t)/60000)}
function fmtMins(m){if(m<60)return m+'分钟';var h=Math.floor(m/60),mm=m%60;return h+'小时'+(mm>0?mm+'分':'')}
function sleepDuration(s,e){var a=new Date(s),b=new Date(e);if(b<a)b=new Date(b.getTime()+86400000);var m=Math.floor((b-a)/60000);return fmtMins(m)}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}
function customConfirm(msg,onYes){
  var box=document.getElementById('confirmBox');
  box.innerHTML='<div class="confirm-msg">'+esc(msg)+'</div><div class="confirm-btns"><button class="btn btn-cancel" onclick="closeConfirm()">取消</button><button class="btn btn-primary" id="cfYes">确认</button></div>';

function closeConfirm(){document.getElementById('confirmMask').classList.remove('show');document.getElementById('confirmBox').classList.remove('show')}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function recTime(r,cfg){return r[cfg.sortField]||r.time||r.startTime}
function defStart(){var now=new Date();var s=new Date(now.getTime()-8*3600000);return s.getFullYear()+'-'+pad(s.getMonth()+1)+'-'+pad(s.getDate())+'T'+pad(s.getHours())+':'+pad(s.getMinutes())}
function blobToB64(blob,cb){var r=new FileReader();r.onload=function(){cb(r.result)};r.onerror=function(){console.warn('blobToB64失败');cb(null)};r.readAsDataURL(blob)}
function b64ToBlob(b64){if(!b64||typeof b64!=='string')throw new Error('无效媒体数据');var arr=b64.split(','),m=arr[0].match(/:(.*?);/);if(!m)throw new Error('媒体格式错误');var mime=m[1],bstr=atob(arr[1]),n=bstr.length,u=new Uint8Array(n);while(n--)u[n]=bstr.charCodeAt(n);return new Blob([u],{type:mime})}
function compressImage(file,cb){
  var reader=new FileReader();
  reader.onerror=function(){console.error('FileReader error');cb(null)};
  reader.onload=function(e){
    var img=new Image();
    img.onerror=function(){console.error('Image load error');cb(null)};
    img.onload=function(){var canvas=document.createElement('canvas'),w=img.width,h=img.height,mw=900;if(w>mw){h=h*mw/w;w=mw}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);try{cb(canvas.toDataURL('image/jpeg',0.7))}catch(err){console.error('Canvas toDataURL error:',err);cb(null)}};
    img.src=e.target.result
  };
  reader.readAsDataURL(file)
}

/* ========== 路由 ========== */
function go(page){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.tabbar .tab').forEach(function(t){t.classList.toggle('active',t.dataset.page===page)});
  if(page==='home')renderHome();
  if(page==='records')renderRecords();
  if(page==='growth')renderGrowth();
  if(page==='review')renderReview();
  if(page==='mine')renderMine();
  window.scrollTo(0,0);
}

function drawLineChart(data,valKey,unit,color){
  var w=400,h=160,pad=30;
  var vals=data.map(function(d){return parseFloat(d[valKey])||0});
  var minV=Math.min.apply(null,vals),maxV=Math.max.apply(null,vals);
  if(minV===maxV){maxV+=1;minV-=1}
  var range=maxV-minV;
  var n=data.length;
  var pts=data.map(function(d,i){var x=pad+(n===1?0:(i/(n-1))*(w-pad*2));var y=h-pad-((parseFloat(d[valKey])||0)-minV)/range*(h-pad*2);return{x:x,y:y}});
  var pl=pts.map(function(p,i){return(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)}).join(' ');
  var svg='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto">';
  svg+='<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#3a3a38" stroke-width="0.5"/>';
  svg+='<line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(h-pad)+'" stroke="#3a3a38" stroke-width="0.5"/>';
  svg+='<text x="'+pad+'" y="'+(pad-8)+'" font-size="9" fill="#9E9C95">'+maxV.toFixed(1)+'</text>';
  svg+='<text x="'+pad+'" y="'+(h-pad+12)+'" font-size="9" fill="#9E9C95" dominant-baseline="hanging">'+minV.toFixed(1)+'</text>';
  svg+='<path d="'+pl+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){svg+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="2.5" fill="'+color+'"/>';if(n<=8)svg+='<text x="'+p.x.toFixed(1)+'" y="'+(p.y-6)+'" font-size="8" fill="#9E9C95" text-anchor="middle">'+(parseFloat(data[i][valKey])||0).toFixed(1)+'</text>'});
  svg+='</svg>';
  return svg;
}

function renderStats(){
  var html='';
  html+='<div class="sub-tabs" style="margin-bottom:14px">';
  html+='<div class="sub-tab '+(statPeriod===7?'active':'')+'" style="'+(statPeriod===7?'background:var(--blue)':'')+'" onclick="switchStatPeriod(7)">近7天</div>';
  html+='<div class="sub-tab '+(statPeriod===30?'active':'')+'" style="'+(statPeriod===30?'background:var(--blue)':'')+'" onclick="switchStatPeriod(30)">近30天</div>';
  html+='</div>';
  var days=statPeriod;
  var feedTot=0,sleepTotMins=0,sleepCnt=0,diaperCnt=0;
  var feedIntervals=[];
  for(var i=days-1;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    var feeds=DB.getList('feed').filter(function(r){return sameDay(r.time,ds)});
    feeds.forEach(function(r){if(r.type==='formula'&&r.amount)feedTot+=parseInt(r.amount)});
    var sleeps=DB.getList('sleep').filter(function(r){return sameDay(r.startTime,ds)||sameDay(r.endTime,ds)});
    sleeps.forEach(function(r){if(r.startTime&&r.endTime){var a=new Date(r.startTime),b=new Date(r.endTime);if(b<a)b=new Date(b.getTime()+86400000);sleepTotMins+=Math.floor((b-a)/60000);sleepCnt++}});
    diaperCnt+=DB.getList('diaper').filter(function(r){return sameDay(r.time,ds)}).length;
    var dayFeeds=feeds.sort(function(a,b){return a.time>b.time?1:-1});
    for(var j=1;j<dayFeeds.length;j++){var m=Math.floor((new Date(dayFeeds[j].time)-new Date(dayFeeds[j-1].time))/60000);if(m>0&&m<600)feedIntervals.push(m)}
  }
  html+='<div class="stat-row"><div class="sr-label">配方奶总量</div><div class="sr-val" style="color:var(--purple-l)">'+feedTot+'<span style="font-size:12px;color:var(--sub)">ml</span></div></div>';
  html+='<div class="stat-row"><div class="sr-label">平均睡眠时长</div><div class="sr-val" style="color:var(--teal-l)">'+(sleepCnt>0?fmtMins(Math.round(sleepTotMins/days)):'—')+'</div></div>';
  html+='<div class="stat-row"><div class="sr-label">换尿布次数</div><div class="sr-val" style="color:var(--pink-l)">'+diaperCnt+'<span style="font-size:12px;color:var(--sub)">次</span></div></div>';
  html+='<div class="stat-row"><div class="sr-label">平均喂养间隔</div><div class="sr-val" style="color:var(--amber-l)">'+(feedIntervals.length>0?fmtMins(Math.round(feedIntervals.reduce(function(a,b){return a+b},0)/feedIntervals.length)):'—')+'</div></div>';
  html+='<div style="margin-top:14px"><button class="btn btn-primary" style="width:100%;background:var(--teal)" onclick="exportCSV()">导出CSV(给儿保医生)</button></div>';
  document.getElementById('review-content').innerHTML=html;
}

  var maxH=Math.max.apply(null,sData.map(function(d){return d.hours}));if(maxH===0)maxH=1;
  html+='<div class="bar-chart">';
  sData.forEach(function(d){var h=Math.round(d.hours/maxH*100);html+='<div class="bar" style="height:'+h+'%;background:var(--blue)" title="'+d.date+':'+d.hours.toFixed(1)+'h"><span class="bar-lbl">'+d.date.slice(5)+'</span>'+(d.hours>0?'<span class="bar-val">'+d.hours.toFixed(1)+'</span>':'')+'</div>'});

  html+='<div class="section-title">每日换尿布(次)</div>';
  var dData=[];

  var maxD=Math.max.apply(null,dData.map(function(d){return d.cnt}));if(maxD===0)maxD=1;
  html+='<div class="bar-chart">';
  dData.forEach(function(d){var h=Math.round(d.cnt/maxD*100);html+='<div class="bar" style="height:'+h+'%;background:var(--pink)" title="'+d.date+':'+d.cnt+'次"><span class="bar-lbl">'+d.date.slice(5)+'</span>'+(d.cnt>0?'<span class="bar-val">'+d.cnt+'</span>':'')+'</div>'});

function exportCSV(){
  var rows=[['日期','时间','类型','内容','备注']];
  REC_ORDER.forEach(function(t){var cfg=REC[t];var list=t.indexOf('custom_')===0?DB.getCustomList(t):DB.getList(t);list.forEach(function(r){rows.push([fmtDate(recTime(r,cfg)),fmtHM(recTime(r,cfg)),cfg.name,cfg.summary(r).replace(/^[^·]*·\s*/,''),r.note||''])})});
  rows.sort(function(a,b){return a[0]+a[1]<b[0]+b[1]?-1:1});
  var csv='\uFEFF';
  rows.forEach(function(r){csv+=r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(',')+'\n'});
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  saveBlob(blob,'baby-records-'+todayStr()+'.csv','已导出CSV');
}

/* ========== 通用文件保存(优先弹另存为对话框) ========== */
function saveBlob(blob,fname,msg){
  var ext='.'+fname.split('.').pop();
  var mime=blob.type.split(';')[0]||'application/octet-stream';
  var accept={};accept[mime]=[ext];
  if(window.showSaveFilePicker){
    window.showSaveFilePicker({suggestedName:fname,types:[{description:msg||fname,accept:accept}]}).then(function(h){
      return h.createWritable();
    }).then(function(w){
      return w.write(blob).then(function(){return w.close()});
    }).then(function(){
      toast(msg||('已保存 '+fname));
    }).catch(function(e){
      if(e&&e.name==='AbortError')return;
      dlFallback(blob,fname,msg);
    });
  } else {dlFallback(blob,fname,msg)}
}
function dlFallback(blob,fname,msg){
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=fname;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast(msg||('已下载 '+fname));
}

/* ========== 备份导出导入(含媒体) ========== */
function exportData(){
  IDB.getAllKeys().then(function(keys){
    var raw=DB.getAllKeys(),data={};
    for(var k in raw)data[k]=raw[k]?raw[k]:null;
    if(!keys||keys.length===0){finishExport({app:'baby-tracker',version:3,exportDate:new Date().toISOString(),data:data,hasMedia:false});return}
    var mediaB64={},done=0;
    keys.forEach(function(mk){
      IDB.get(mk).then(function(blob){
        if(blob){blobToB64(blob,function(b64){if(b64)mediaB64[String(mk)]=b64;else console.warn('媒体转换失败:',mk);done++;if(done===keys.length)finishExport({app:'baby-tracker',version:3,exportDate:new Date().toISOString(),data:data,hasMedia:Object.keys(mediaB64).length>0,media:mediaB64})})}
        else{done++;if(done===keys.length)finishExport({app:'baby-tracker',version:3,exportDate:new Date().toISOString(),data:data,hasMedia:Object.keys(mediaB64).length>0,media:mediaB64})}
      });
    });
  });
}
function finishExport(pkg){
  var blob=new Blob([JSON.stringify(pkg)],{type:'application/json'});
  var d=new Date();
  var fname='baby-tracker-backup-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
  saveBlob(blob,fname,'已保存 '+fname);
}
document.getElementById('importInput').addEventListener('change',function(e){
  var inputEl=e.target;
  var file=inputEl.files[0];
  if(!file){return}
  console.log('[导入] 选择文件:',file.name,file.size,'bytes');
  var reader=new FileReader();
  reader.onerror=function(){console.error('[导入] FileReader错误');toast('读取文件失败，请重试');inputEl.value=''};
  reader.onload=function(ev){
    var pkg;
    try{
      pkg=JSON.parse(ev.target.result);
      console.log('[导入] JSON解析成功, app=',pkg.app,'version=',pkg.version);
    }catch(err){
      console.error('[导入] JSON解析失败:',err);
      toast('文件解析失败：不是有效的JSON文件');
      inputEl.value='';
      return;
    }
    if(!pkg||pkg.app!=='baby-tracker'){
      toast('文件格式不对：不是宝宝记录备份文件');
      inputEl.value='';
      return;
    }
    if(!pkg.data){
      toast('文件内容缺失：没有数据');
      inputEl.value='';
      return;
    }
    customConfirm('导入将合并到当前数据中：\n• 时间相同的记录会覆盖更新\n• 不同的记录按时间顺序插入\n• 照片/视频按需补充\n确定继续吗？',function(){
      console.log('[导入] 用户确认，开始合并导入');
      try{
        var stats=DB.mergeData(pkg.data);
        console.log('[导入] 合并完成: 新增='+stats.added+' 覆盖='+stats.merged);
        loadRecTypes();
        // 媒体：不清除现有的，只补充导入的（相同key覆盖）
        if(!pkg.media||Object.keys(pkg.media).length===0){
          console.log('[导入] 无媒体，直接完成');
          toast('导入成功：新增'+stats.added+'条，覆盖'+stats.merged+'条');
          go('home');
          inputEl.value='';
          return;
        }
        var keys=Object.keys(pkg.media);
        var total=keys.length;
        var done=0,fail=0;
        console.log('[导入] 媒体数量:',total);
        function finishImport(){
          if(done+fail<total)return;
          var msg='导入成功：新增'+stats.added+'条，覆盖'+stats.merged+'条';
          if(fail>0)msg+='，'+fail+'个媒体失败';
          console.log('[导入] 全部完成 done='+done+' fail='+fail);
          toast(msg);
          go('home');
          inputEl.value='';
        }
        keys.forEach(function(mk){
          var blob;
          try{
            blob=b64ToBlob(pkg.media[mk]);
          }catch(err){
            console.error('[导入] 媒体'+mk+' b64ToBlob失败:',err.message);
            fail++;finishImport();return;
          }
          IDB.put(mk,blob).then(function(){
            done++;console.log('[导入] 媒体完成:',done+'/'+total);finishImport();
          }).catch(function(err){
            console.error('[导入] 媒体'+mk+' IDB.put失败:',err);
            fail++;finishImport();
          });
        });
      }catch(err){
        console.error('[导入] 出错:',err);
        toast('导入出错：'+err.message);
        inputEl.value='';
      }
    });
  };
  reader.readAsText(file);
});
